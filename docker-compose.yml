# ==============================================================================
# 墨枢 · InkVerse (By Timskt) — 纯净全栈容器化编排 (Docker Compose)
# 架构：Rust 2.0 (Axum + SQLite WAL + Git VCS) + React 19 (Tailwind v4 + Nginx)
#
# 快速启动:
#   docker compose up -d --build
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. 墨枢 · InkVerse Rust 2.0 高性能核心后端 (Axum + SQLite WAL + Git VCS)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend_rust
      dockerfile: Dockerfile
    image: inkverse/backend-rust:2.0.0
    container_name: inkverse-backend
    restart: unless-stopped
    environment:
      PORT: "8000"
      NOV_DB_PATH: "/app/data/novmanager_local.db"
      NOV_REPO_DIR: "/app/manuscripts"
      RUST_LOG: "${RUST_LOG:-nov_server=info,tower_http=info}"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
      - ./manuscripts:/app/manuscripts
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    networks:
      - inkverse-net

  # ----------------------------------------------------------------------------
  # 2. 墨枢 · InkVerse 前端文学创作工作台 (React 19 + Tailwind v4 + Nginx)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "/api"
    image: inkverse/frontend-web:2.0.0
    container_name: inkverse-web
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:80/healthz"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 3
    networks:
      - inkverse-net

networks:
  inkverse-net:
    driver: bridge
